
<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inbondz | Mesh Network & AI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { gray: { 850: '#1a2232', 900: '#111827', 950: '#070b14' } } } }
        }
    </script>

    <!-- FontAwesome, Marked, DOMPurify & Gun.js (P2P Network) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.3/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>

    <style>
        /* Mobile viewport 100dvh fix */
        html, body { height: 100%; height: 100dvh; overflow: hidden; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        
        .prose pre { background-color: #030712; padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem;}
        .prose code { color: #818cf8; font-family: monospace; }
        .prose p { margin-bottom: 0.25rem; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 flex h-[100dvh] w-screen overflow-hidden font-sans">

    <!-- SIDEBAR OVERLAY (Mobile) -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/70 z-20 hidden md:hidden"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-72 bg-gray-900 border-r border-gray-800 flex flex-col z-30 transform -translate-x-full md:translate-x-0 transition-transform duration-200">
        
        <div class="p-5 border-b border-gray-800 flex justify-between items-center bg-gray-950">
            <h1 class="text-lg font-bold tracking-widest text-white">INBONDZ</h1>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-400 p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        
        <div class="p-3 text-xs font-bold tracking-wider text-gray-500 uppercase mt-2">Network Channels</div>
        
        <!-- Channels -->
        <div class="flex-1 overflow-y-auto px-3 space-y-2">
            <button onclick="switchChannel('global')" id="btn-global" class="w-full flex items-center gap-3 text-left py-2.5 px-3 rounded-xl text-sm font-medium transition bg-gray-800 text-white border border-gray-700">
                <i class="fa-solid fa-earth-americas text-emerald-400"></i>
                <div class="flex-1">
                    <p>Global P2P Mesh</p>
                    <p class="text-[10px] text-gray-400 font-normal">Human Chat Room</p>
                </div>
            </button>

            <button onclick="switchChannel('ai')" id="btn-ai" class="w-full flex items-center gap-3 text-left py-2.5 px-3 rounded-xl text-sm font-medium transition text-gray-400 hover:bg-gray-850 hover:text-gray-200 border border-transparent">
                <i class="fa-solid fa-microchip text-blue-400"></i>
                <div class="flex-1">
                    <p>Inbondz AI</p>
                    <p class="text-[10px] text-gray-400 font-normal">Private Assistant</p>
                </div>
            </button>
        </div>

        <!-- User Profile Bottom Bar -->
        <div class="p-3 border-t border-gray-800 flex items-center justify-between bg-gray-900/80 cursor-pointer hover:bg-gray-800 transition" onclick="openSettings()">
            <div class="flex items-center gap-3 min-w-0 flex-1">
                <div class="w-9 h-9 rounded-full bg-blue-600/30 border border-blue-500/50 text-blue-400 flex items-center justify-center text-sm font-bold flex-shrink-0" id="userAvatar">A</div>
                <div class="min-w-0 flex-1">
                    <p class="text-sm font-semibold truncate text-white" id="displayNameText">Anon</p>
                    <p class="text-[10px] text-emerald-400 truncate"><i class="fa-solid fa-circle text-[6px] mr-1"></i> Identity Secured</p>
                </div>
            </div>
            <i class="fa-solid fa-gear text-gray-400 text-sm p-2"></i>
        </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="flex-1 flex flex-col h-full w-full bg-gray-950 relative overflow-hidden">
        
        <header class="h-14 border-b border-gray-800/80 bg-gray-900/60 backdrop-blur-md flex items-center justify-between px-4 z-10 flex-shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white p-1 mr-2">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <h2 id="channelTitle" class="text-sm font-bold text-gray-200">Global P2P Mesh</h2>
            </div>
            <div id="channelStatus" class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-[10px] font-bold tracking-widest text-gray-400 uppercase">Live Sync</span>
            </div>
        </header>

        <!-- Messages Container -->
        <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-5 pb-28">
            <!-- Messages injected here via JS -->
        </div>

        <!-- Input Area -->
        <div class="absolute bottom-0 left-0 right-0 p-3 md:p-4 bg-gradient-to-t from-gray-950 via-gray-950 to-transparent">
            <div class="max-w-4xl mx-auto flex items-end bg-gray-900 border border-gray-700 rounded-2xl p-1.5 shadow-2xl focus-within:border-gray-500 transition-colors">
                <textarea id="messageInput" rows="1" class="flex-1 bg-transparent text-sm text-white px-3 py-2.5 focus:outline-none resize-none max-h-32" placeholder="Send a message..." oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
                <button id="sendBtn" onclick="sendMessage()" class="w-10 h-10 bg-blue-600 hover:bg-blue-500 text-white rounded-xl flex items-center justify-center transition flex-shrink-0 disabled:opacity-40 ml-1">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-gray-900 w-full max-w-sm rounded-2xl border border-gray-800 shadow-2xl flex flex-col overflow-hidden">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-950">
                <h2 class="text-sm font-bold tracking-wide">Identity Settings</h2>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="p-5 space-y-5">
                <!-- Display Name -->
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5">Public Display Name (For Global Chat)</label>
                    <input type="text" id="displayNameInput" class="w-full bg-gray-950 border border-gray-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="e.g. Neo">
                </div>

                <hr class="border-gray-800">

                <!-- Biometric Copy Passphrase -->
                <div>
                    <p class="text-xs font-medium text-gray-400 mb-2">Recovery Passphrase (Never shown on screen)</p>
                    <button onclick="copyPassphraseBiometric()" id="biometricCopyBtn" class="w-full bg-gray-800 hover:bg-gray-700 border border-gray-600 text-white text-sm font-medium py-3 rounded-xl transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-fingerprint text-blue-400"></i> Verify Biometric to Copy
                    </button>
                    <p class="text-[10px] text-gray-500 text-center mt-2">Requires TouchID, FaceID, or Device PIN to copy.</p>
                </div>

                <!-- Restore Account -->
                <div class="pt-2 border-t border-gray-800">
                    <label class="block text-xs font-medium text-gray-400 mb-1.5">Restore Account</label>
                    <div class="flex gap-2">
                        <input type="text" id="restoreInput" class="flex-1 bg-gray-950 border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-blue-500" placeholder="Paste 12 words here...">
                        <button onclick="restoreAccount()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-4 rounded-xl transition">Restore</button>
                    </div>
                </div>

                <div class="pt-2">
                    <button onclick="saveSettings()" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium py-3 rounded-xl transition shadow-lg shadow-blue-600/20">
                        Save Profile
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. STATE & IDENTITY INITIALIZATION ---
        const WORD_LIST = ["alpha","bravo","charlie","delta","echo","foxtrot","golf","hotel","india","juliet","kilo","lima","mike","november","oscar","papa","quebec","romeo","sierra","tango","uniform","victor","whiskey","xray","yankee","zulu","quantum","node","block","chain","hash","cipher","pulse","grid","mesh"];
        
        let state = {
            channel: 'global', // 'global' or 'ai'
            displayName: 'Anon-' + Math.floor(Math.random() * 9999),
            passphrase: '',
            aiHistory: JSON.parse(localStorage.getItem('inbondz_ai_history') || '[]')
        };

        // Gun.js Initialization (Connects to free community P2P relay)
        const gun = Gun(['https://gun-manhattan.herokuapp.com/gun']);
        const globalChatNode = gun.get('inbondz_global_mesh_2026_v2');

        window.onload = () => {
            initIdentity();
            updateProfileUI();
            switchChannel('global'); // Default to global chat
        };

        function initIdentity() {
            let savedName = localStorage.getItem('inbondz_name');
            let savedPhrase = localStorage.getItem('inbondz_phrase');
            
            if (!savedPhrase) {
                // Instantly generate invisible identity on first load
                let phraseArr = [];
                for(let i=0; i<12; i++) phraseArr.push(WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)]);
                savedPhrase = phraseArr.join(' ');
                savedName = state.displayName; // Use the generated Anon name
                
                localStorage.setItem('inbondz_phrase', savedPhrase);
                localStorage.setItem('inbondz_name', savedName);
            }

            state.passphrase = savedPhrase;
            state.displayName = savedName;
        }

        // --- 2. BIOMETRIC CLIPBOARD COPY (Strict Rule Adherence) ---
        async function copyPassphraseBiometric() {
            const btn = document.getElementById('biometricCopyBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';
            
            try {
                // Force platform biometric prompt (TouchID/FaceID)
                if (window.PublicKeyCredential && window.location.protocol === 'https:') {
                    const challenge = new Uint8Array(32);
                    window.crypto.getRandomValues(challenge);
                    
                    await navigator.credentials.create({
                        publicKey: {
                            challenge: challenge,
                            rp: { name: "Inbondz", id: window.location.hostname },
                            user: { id: new Uint8Array(16), name: "user", displayName: "User" },
                            pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                            timeout: 60000
                        }
                    });
                }
                
                // Success: Write to clipboard silently. NEVER render on screen.
                await navigator.clipboard.writeText(state.passphrase);
                btn.innerHTML = '<i class="fa-solid fa-check text-green-400"></i> Copied to Clipboard!';
                btn.classList.replace('bg-gray-800', 'bg-green-900/30');
                btn.classList.replace('border-gray-600', 'border-green-500/50');
                
            } catch (err) {
                // User cancelled or device has no biometric scanner
                console.warn(err);
                if (err.name === 'NotAllowedError') {
                    btn.innerHTML = '<i class="fa-solid fa-xmark text-red-400"></i> Cancelled';
                } else {
                    // Fallback for HTTP / Desktop without scanners: Just copy it.
                    await navigator.clipboard.writeText(state.passphrase);
                    btn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> Device Unsecured: Copied!';
                }
            }

            // Reset button after 3 seconds
            setTimeout(() => { 
                btn.innerHTML = originalHTML; 
                btn.className = "w-full bg-gray-800 hover:bg-gray-700 border border-gray-600 text-white text-sm font-medium py-3 rounded-xl transition flex items-center justify-center gap-2";
            }, 3000);
        }

        // --- 3. UI & SETTINGS LOGIC ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        }

        function openSettings() {
            document.getElementById('displayNameInput').value = state.displayName;
            document.getElementById('settingsModal').classList.remove('hidden');
        }
        function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }

        function saveSettings() {
            const newName = document.getElementById('displayNameInput').value.trim();
            if(newName) {
                state.displayName = newName;
                localStorage.setItem('inbondz_name', newName);
                updateProfileUI();
            }
            closeSettings();
        }

        function updateProfileUI() {
            document.getElementById('displayNameText').innerText = state.displayName;
            document.getElementById('userAvatar').innerText = state.displayName.charAt(0).toUpperCase();
        }

        function restoreAccount() {
            const input = document.getElementById('restoreInput').value.trim();
            if(input.split(' ').length > 5) { // Simple check
                localStorage.setItem('inbondz_phrase', input);
                alert("Account Restored! The page will now reload.");
                location.reload();
            } else {
                alert("Invalid passphrase format.");
            }
        }

        // --- 4. CHANNEL SWITCHING ---
        function switchChannel(channelType) {
            state.channel = channelType;
            const container = document.getElementById('messagesContainer');
            container.innerHTML = ''; // Clear current view
            
            // UI Button Updates
            document.getElementById('btn-global').className = `w-full flex items-center gap-3 text-left py-2.5 px-3 rounded-xl text-sm font-medium transition ${channelType === 'global' ? 'bg-gray-800 text-white border border-gray-700' : 'text-gray-400 hover:bg-gray-850 hover:text-gray-200 border border-transparent'}`;
            document.getElementById('btn-ai').className = `w-full flex items-center gap-3 text-left py-2.5 px-3 rounded-xl text-sm font-medium transition ${channelType === 'ai' ? 'bg-gray-800 text-white border border-gray-700' : 'text-gray-400 hover:bg-gray-850 hover:text-gray-200 border border-transparent'}`;

            if(channelType === 'global') {
                document.getElementById('channelTitle').innerText = "Global P2P Mesh";
                document.getElementById('channelStatus').innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span class="text-[10px] font-bold tracking-widest text-gray-400 uppercase">Live Sync</span>';
                document.getElementById('messageInput').placeholder = "Message the global network...";
                loadGlobalChat();
            } else {
                document.getElementById('channelTitle').innerText = "Inbondz AI";
                document.getElementById('channelStatus').innerHTML = '<span class="w-2 h-2 rounded-full bg-blue-500"></span><span class="text-[10px] font-bold tracking-widest text-gray-400 uppercase">Private</span>';
                document.getElementById('messageInput').placeholder = "Ask the AI anything...";
                renderAIChat();
            }

            if(!document.getElementById('sidebarOverlay').classList.contains('hidden')) toggleSidebar();
        }

        // --- 5. GLOBAL P2P CHAT LOGIC (Gun.js) ---
        let globalChatLoaded = false;
        function loadGlobalChat() {
            if(!globalChatLoaded) {
                // Listen for new messages across the P2P network
                globalChatNode.map().once((data, id) => {
                    if (data && data.text && state.channel === 'global') {
                        renderSingleMessage(data.user, data.text, data.user === state.displayName, false);
                    }
                });
                globalChatLoaded = true;
            } else {
                // Fetch recent from memory (Gun caches this automatically)
                globalChatNode.map().once((data, id) => {
                    if (data && data.text) renderSingleMessage(data.user, data.text, data.user === state.displayName, false);
                });
            }
        }

        // --- 6. AI CHAT LOGIC ---
        function renderAIChat() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            
            if(state.aiHistory.length === 0) {
                container.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center text-gray-600 text-center p-4">
                    <i class="fa-solid fa-microchip text-4xl mb-3 text-blue-500/40"></i>
                    <h2 class="text-base font-medium text-gray-300">Inbondz AI Assistant</h2>
                    <p class="text-xs text-gray-500 max-w-xs mt-1">This chat is stored locally. Free AI inferences provided via public routing.</p>
                </div>`;
                return;
            }

            state.aiHistory.forEach(msg => {
                renderSingleMessage(msg.role === 'user' ? state.displayName : 'Inbondz AI', msg.text, msg.role === 'user', true);
            });
            container.scrollTop = container.scrollHeight;
        }

        // --- 7. MESSAGE RENDERING & SENDING ---
        function renderSingleMessage(name, text, isMe, parseMarkdown) {
            const container = document.getElementById('messagesContainer');
            
            // Remove empty state if present
            const emptyState = container.querySelector('.h-full.flex-col');
            if(emptyState) emptyState.remove();

            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-4`;
            
            // Name Tag
            if (!isMe) {
                const nameTag = document.createElement('span');
                nameTag.className = `text-[10px] font-bold mb-1 ml-1 ${name === 'Inbondz AI' ? 'text-blue-400' : 'text-gray-500'}`;
                nameTag.innerText = name;
                div.appendChild(nameTag);
            }

            const bubble = document.createElement('div');
            bubble.className = isMe 
                ? 'bg-blue-600 text-white text-[13px] md:text-sm px-4 py-2.5 rounded-2xl rounded-tr-sm max-w-[85%] break-words'
                : 'bg-gray-900 border border-gray-800 text-gray-200 text-[13px] md:text-sm px-4 py-3 rounded-2xl rounded-tl-sm max-w-[90%] prose prose-invert break-words shadow-md';

            // Safe HTML Parsing
            let safeContent = DOMPurify.sanitize(text);
            if(parseMarkdown && !isMe) {
                safeContent = DOMPurify.sanitize(marked.parse(text));
            }
            
            bubble.innerHTML = safeContent;
            div.appendChild(bubble);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            const btn = document.getElementById('sendBtn');

            if (!text) return;
            
            input.value = ''; input.style.height = 'auto';
            btn.disabled = true;

            if (state.channel === 'global') {
                // Send to Gun.js P2P Mesh
                globalChatNode.set({ user: state.displayName, text: text, time: Date.now() });
                btn.disabled = false;
                // Note: It will render automatically because of the `globalChatNode.map().once` listener!
            } 
            else if (state.channel === 'ai') {
                // 1. Render User Message
                state.aiHistory.push({ role: 'user', text: text });
                localStorage.setItem('inbondz_ai_history', JSON.stringify(state.aiHistory));
                renderSingleMessage(state.displayName, text, true, false);

                // 2. Render "Generating..." State
                const container = document.getElementById('messagesContainer');
                const genDiv = document.createElement('div');
                genDiv.id = "ai-generating";
                genDiv.className = `flex flex-col items-start mb-4`;
                genDiv.innerHTML = `
                    <span class="text-[10px] font-bold mb-1 ml-1 text-blue-400">Inbondz AI</span>
                    <div class="bg-gray-900 border border-gray-800 text-gray-400 text-xs px-4 py-3 rounded-2xl rounded-tl-sm shadow-md flex items-center gap-2">
                        <i class="fa-solid fa-circle-notch fa-spin text-blue-500"></i> Generating reply...
                    </div>`;
                container.appendChild(genDiv);
                container.scrollTop = container.scrollHeight;

                try {
                    // Fetch from a robust, keyless open AI proxy. Using encodeURIComponent ensures questions aren't blocked by URL parsing errors.
                    const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?model=openai`);
                    
                    if(!response.ok) throw new Error("API Limit Reached");
                    
                    const aiReply = await response.text();

                    // Remove Generating State
                    document.getElementById('ai-generating').remove();

                    // Save and Render AI Reply
                    state.aiHistory.push({ role: 'assistant', text: aiReply });
                    localStorage.setItem('inbondz_ai_history', JSON.stringify(state.aiHistory));
                    renderSingleMessage('Inbondz AI', aiReply, false, true);

                } catch (err) {
                    document.getElementById('ai-generating').remove();
                    const errorMsg = "⚠️ **Network Overloaded.** The free AI proxy is currently rejecting requests (429). But the **Global P2P Mesh** in the sidebar is 100% online—go chat with real humans!";
                    state.aiHistory.push({ role: 'assistant', text: errorMsg });
                    localStorage.setItem('inbondz_ai_history', JSON.stringify(state.aiHistory));
                    renderSingleMessage('Inbondz AI', errorMsg, false, true);
                } finally {
                    btn.disabled = false;
                }
            }
        }
    </script>
</body>
</html>
