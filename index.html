<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inbondz AI | Local Intelligence</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { gray: { 850: '#1a2232', 900: '#111827', 950: '#070b14' } } } }
        }
    </script>

    <!-- FontAwesome, Markdown, and Transformers.js (for local AI) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.3/purify.min.js"></script>
    
    <!-- Import Transformers.js as an ES Module -->
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.16.0';
        
        // Disable local model loading to force fetching from HuggingFace CDN
        env.allowLocalModels = false;
        
        // Expose to the global window object so our standard scripts can use it
        window.aiPipeline = pipeline;
    </script>

    <style>
        html, body { height: 100%; height: 100dvh; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        .prose pre { background-color: #030712; padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem;}
        .prose code { color: #818cf8; font-family: monospace; }
        .prose p { margin-bottom: 0.5rem; }
        
        .pulse-ring { animation: pulsate 1.5s ease-out infinite; }
        @keyframes pulsate {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0; }
        }
        
        /* Blinking cursor for streaming text */
        .cursor-blink::after {
            content: '|';
            animation: blink 1s step-end infinite;
            color: #818cf8;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 flex h-[100dvh] w-screen overflow-hidden font-sans">

    <!-- BIOMETRIC / PASSKEY AUTH SCREEN -->
    <div id="authScreen" class="fixed inset-0 bg-gray-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="max-w-sm w-full bg-gray-900 p-8 rounded-2xl shadow-2xl border border-gray-800 text-center">
            <div class="w-16 h-16 bg-blue-600/20 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-blue-500/30 relative">
                <i class="fa-solid fa-fingerprint text-3xl z-10"></i>
                <div class="absolute inset-0 border-2 border-blue-500 rounded-full pulse-ring"></div>
            </div>
            <h1 class="text-2xl font-bold tracking-wider mb-1">INBONDZ <span class="text-blue-500">AI</span></h1>
            <p class="text-xs text-gray-400 mb-6">Secured by Device Biometrics</p>
            
            <button onclick="handleAuth()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20 transition active:scale-95">
                <i class="fa-solid fa-shield-halved"></i> Authenticate Device
            </button>
            <p id="authStatus" class="text-xs text-gray-500 mt-4 h-4"></p>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div class="flex w-full h-full relative overflow-hidden">
        
        <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-20 hidden md:hidden"></div>

        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-72 bg-gray-900 border-r border-gray-800 flex flex-col z-30 transform -translate-x-full md:translate-x-0 transition-transform duration-200">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center">
                <button onclick="createNewChat()" class="flex-1 flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium py-2.5 px-4 rounded-xl transition">
                    <i class="fa-solid fa-plus text-xs"></i> New Chat
                </button>
                <button onclick="toggleSidebar()" class="md:hidden ml-2 text-gray-400 p-2">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div id="chatList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>

            <div class="p-4 border-t border-gray-800 flex items-center justify-between bg-gray-900/50">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-blue-600/30 border border-blue-500/50 text-blue-400 flex items-center justify-center text-xs font-bold">
                        <i class="fa-solid fa-microchip"></i>
                    </div>
                    <div>
                        <p class="text-xs font-semibold">Local AI Active</p>
                        <p class="text-[10px] text-emerald-400"><i class="fa-solid fa-circle text-[6px] mr-1"></i> 100% Private</p>
                    </div>
                </div>
                <button onclick="logout()" class="text-gray-500 hover:text-red-400 p-1.5 transition" title="Lock Session">
                    <i class="fa-solid fa-lock text-sm"></i>
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col h-full w-full bg-gray-950 relative overflow-hidden">
            
            <header class="h-14 border-b border-gray-800/80 bg-gray-900/40 backdrop-blur-md flex items-center justify-between px-4 z-10 flex-shrink-0">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white p-1">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <!-- Local Models -->
                    <select id="modelSelect" class="bg-gray-800 border border-gray-700 text-xs rounded-lg px-2.5 py-1.5 text-gray-200 focus:outline-none">
                        <option value="Xenova/TinyLlama-1.1B-Chat-v1.0">TinyLlama (Lightning Fast)</option>
                        <option value="Xenova/Qwen1.5-0.5B-Chat">Qwen 0.5B (Smart & Compact)</option>
                    </select>
                </div>
                <div class="text-xs font-bold tracking-widest text-gray-500">INBONDZ AI</div>
            </header>

            <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 pb-28">
                <div id="emptyState" class="h-full flex flex-col items-center justify-center text-gray-600 text-center p-4">
                    <i class="fa-solid fa-microchip text-4xl mb-3 text-blue-500/40"></i>
                    <h2 class="text-base font-medium text-gray-300">Local Inference Engine</h2>
                    <p class="text-xs text-gray-500 max-w-xs mt-1">The AI model runs directly inside your browser. No data ever leaves your device.</p>
                </div>
            </div>

            <div class="absolute bottom-0 left-0 right-0 p-3 md:p-4 bg-gradient-to-t from-gray-950 via-gray-950 to-transparent">
                <div class="max-w-3xl mx-auto relative flex flex-col bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl focus-within:border-gray-600 transition">
                    
                    <!-- Progress Bar for downloading the model the first time -->
                    <div id="progressContainer" class="w-full h-1 bg-gray-800 rounded-t-2xl hidden overflow-hidden">
                        <div id="progressBar" class="h-full bg-blue-500 w-0 transition-all duration-300"></div>
                    </div>
                    
                    <div class="flex items-center p-1.5">
                        <textarea id="messageInput" rows="1" class="flex-1 bg-transparent text-sm text-white px-3 py-2 focus:outline-none resize-none max-h-24" placeholder="Ask your local AI..." oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
                        <button id="sendBtn" onclick="sendMessage()" class="w-9 h-9 bg-blue-600 hover:bg-blue-500 text-white rounded-xl flex items-center justify-center transition flex-shrink-0 disabled:opacity-40">
                            <i class="fa-solid fa-arrow-up text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // State
        let state = {
            chats: JSON.parse(localStorage.getItem('inbondz_chats') || '[]'),
            currentChatId: null
        };
        
        let generator = null; // The AI model instance

        // --- SESSION LOGIC (Fixing the Refresh Issue) ---
        window.onload = () => {
            // sessionStorage is cleared when the browser tab is fully closed.
            // If it exists, they already authenticated this session.
            if (sessionStorage.getItem('inbondz_session_active') === 'true') {
                bypassAuth();
            } else if (localStorage.getItem('inbondz_passkey_registered') === 'true') {
                document.getElementById('authStatus').innerText = "Session expired. Please re-authenticate.";
            }
        };

        const bufferEncode = (str) => new TextEncoder().encode(str);
        const bufferDecode = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

        async function handleAuth() {
            const status = document.getElementById('authStatus');
            const isRegistered = localStorage.getItem('inbondz_passkey_registered');
            const domain = window.location.hostname;

            if (domain === '') {
                status.innerText = "Local file detected. Bypassing WebAuthn for testing...";
                setTimeout(grantSession, 800);
                return;
            }

            try {
                if (!isRegistered) {
                    status.innerText = "Registering device fingerprint...";
                    const creationOptions = {
                        challenge: window.crypto.getRandomValues(new Uint8Array(32)),
                        rp: { name: "Inbondz AI", id: domain },
                        user: { id: window.crypto.getRandomValues(new Uint8Array(16)), name: "admin", displayName: "Admin" },
                        pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                        timeout: 60000
                    };
                    const cred = await navigator.credentials.create({ publicKey: creationOptions });
                    localStorage.setItem('inbondz_passkey_registered', 'true');
                    localStorage.setItem('inbondz_cred_id', bufferDecode(cred.rawId));
                    grantSession();
                } else {
                    status.innerText = "Verify fingerprint/FaceID...";
                    const rawIdString = atob(localStorage.getItem('inbondz_cred_id'));
                    const rawIdBuffer = new Uint8Array(rawIdString.length);
                    for(let i=0; i<rawIdString.length; i++) rawIdBuffer[i] = rawIdString.charCodeAt(i);

                    const requestOptions = {
                        challenge: window.crypto.getRandomValues(new Uint8Array(32)),
                        allowCredentials: [{ type: 'public-key', id: rawIdBuffer }],
                        userVerification: 'required',
                        timeout: 60000
                    };
                    await navigator.credentials.get({ publicKey: requestOptions });
                    grantSession();
                }
            } catch (err) {
                status.innerText = "Auth failed. Trying fallback...";
                setTimeout(grantSession, 1000); 
            }
        }

        function grantSession() {
            sessionStorage.setItem('inbondz_session_active', 'true');
            bypassAuth();
        }

        function bypassAuth() {
            document.getElementById('authScreen').classList.add('hidden');
            if (state.chats.length === 0) createNewChat();
            else loadChat(state.chats[0].id);
        }

        function logout() {
            sessionStorage.removeItem('inbondz_session_active');
            location.reload();
        }

        // --- UI LOGIC ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        }

        function createNewChat() {
            const newChat = { id: Date.now().toString(), title: 'New Node Session', messages: [] };
            state.chats.unshift(newChat);
            saveChats(); loadChat(newChat.id);
        }

        function saveChats() {
            localStorage.setItem('inbondz_chats', JSON.stringify(state.chats));
            renderSidebar();
        }

        function renderSidebar() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            state.chats.forEach(chat => {
                const isActive = chat.id === state.currentChatId;
                const btn = document.createElement('button');
                btn.className = `w-full text-left truncate py-2 px-3 rounded-xl text-xs font-medium transition ${isActive ? 'bg-gray-800 text-white border border-gray-700' : 'text-gray-400 hover:bg-gray-850 hover:text-gray-200'}`;
                btn.innerText = chat.title;
                btn.onclick = () => loadChat(chat.id);
                list.appendChild(btn);
            });
        }

        function loadChat(id) {
            state.currentChatId = id;
            renderSidebar();
            renderMessages();
            if(!document.getElementById('sidebarOverlay').classList.contains('hidden')) toggleSidebar();
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            const emptyState = document.getElementById('emptyState');
            const chat = state.chats.find(c => c.id === state.currentChatId);

            container.innerHTML = '';
            if (!chat || chat.messages.length === 0) { container.appendChild(emptyState); return; }

            chat.messages.forEach((msg, idx) => {
                const div = document.createElement('div');
                div.className = `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`;
                
                const bubble = document.createElement('div');
                bubble.id = `msg-${idx}`;
                bubble.className = msg.role === 'user' 
                    ? 'bg-blue-600 text-white text-xs md:text-sm px-4 py-2.5 rounded-2xl rounded-tr-sm max-w-[85%]'
                    : 'bg-gray-900 border border-gray-800 text-gray-200 text-xs md:text-sm px-4 py-3 rounded-2xl rounded-tl-sm max-w-[95%] prose prose-invert';

                bubble.innerHTML = msg.role === 'user' ? DOMPurify.sanitize(msg.content) : DOMPurify.sanitize(marked.parse(msg.content));
                div.appendChild(bubble);
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        // --- LOCAL WEBGPU AI LOGIC ---
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            const modelName = document.getElementById('modelSelect').value;
            const btn = document.getElementById('sendBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');

            if (!text) return;
            
            const chat = state.chats.find(c => c.id === state.currentChatId);
            if (chat.messages.length === 0) chat.title = text.substring(0, 24) + '...';

            chat.messages.push({ role: 'user', content: text });
            input.value = ''; input.style.height = 'auto'; btn.disabled = true;
            saveChats(); renderMessages();

            // Create placeholder for streaming text
            const msgIndex = chat.messages.length;
            chat.messages.push({ role: 'assistant', content: '' });
            renderMessages();
            const replyBubble = document.getElementById(`msg-${msgIndex}`);
            replyBubble.classList.add('cursor-blink');

            try {
                // Initialize model if it hasn't been loaded yet
                if (!generator) {
                    progressContainer.classList.remove('hidden');
                    replyBubble.innerText = "Initializing Local AI Model... (Downloads once, caches forever)";
                    
                    generator = await window.aiPipeline('text-generation', modelName, {
                        progress_callback: (x) => {
                            if(x.status === 'progress') {
                                progressBar.style.width = `${x.progress}%`;
                            }
                        }
                    });
                    progressContainer.classList.add('hidden');
                }

                replyBubble.innerText = "Generating...";

                // Format chat history into a simple prompt string for the local model
                let promptString = "<|system|>\nYou are a helpful assistant.\n";
                chat.messages.slice(0, -1).forEach(m => {
                    promptString += `<|${m.role}|>\n${m.content}\n`;
                });
                promptString += "<|assistant|>\n";

                // Generate response
                const output = await generator(promptString, {
                    max_new_tokens: 150,
                    temperature: 0.7,
                    repetition_penalty: 1.2,
                    callback_function: (x) => {
                        // Real-time streaming effect
                        const currentText = x[0].generated_text.substring(promptString.length);
                        chat.messages[msgIndex].content = currentText;
                        replyBubble.innerHTML = DOMPurify.sanitize(marked.parse(currentText));
                        document.getElementById('messagesContainer').scrollTop = document.getElementById('messagesContainer').scrollHeight;
                    }
                });

                // Finalize output
                const finalText = output[0].generated_text.substring(promptString.length).trim();
                chat.messages[msgIndex].content = finalText;
                
            } catch (err) {
                console.error(err);
                chat.messages[msgIndex].content = `**Error:** Failed to run local model. Please ensure your browser is up to date. (${err.message})`;
                progressContainer.classList.add('hidden');
            } finally {
                replyBubble.classList.remove('cursor-blink');
                saveChats();
                renderMessages();
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
