
<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inbondz AI | Seamless Intelligence</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 850: '#1a2232', 900: '#111827', 950: '#070b14' }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome & Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.3/purify.min.js"></script>

    <style>
        /* Mobile Viewport Fix */
        html, body { height: 100%; height: 100dvh; overflow: hidden; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        
        /* Markdown Styling */
        .prose pre { background-color: #030712; padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; }
        .prose code { color: #818cf8; font-family: monospace; }
        .prose p { margin-bottom: 0.5rem; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 flex h-[100dvh] w-screen overflow-hidden font-sans">

    <!-- BIOMETRIC / PASSKEY AUTH SCREEN -->
    <div id="authScreen" class="fixed inset-0 bg-gray-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="max-w-sm w-full bg-gray-900 p-8 rounded-2xl shadow-2xl border border-gray-800 text-center">
            <div class="w-16 h-16 bg-blue-600/20 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-blue-500/30">
                <i class="fa-solid fa-fingerprint text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-wider mb-1">INBONDZ <span class="text-blue-500">AI</span></h1>
            <p class="text-xs text-gray-400 mb-6">Zero Passwords. Instant Access.</p>
            
            <button onclick="authenticateWithPasskey()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20 transition active:scale-95">
                <i class="fa-solid fa-shield-halved"></i> Login with Passkey
            </button>
            <p id="authStatus" class="text-xs text-gray-500 mt-4 h-4"></p>
        </div>
    </div>

    <!-- MAIN APP SCREEN Layout -->
    <div class="flex w-full h-full relative overflow-hidden">
        
        <!-- Sidebar Drawer Overlay (Mobile) -->
        <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-20 hidden md:hidden"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-72 bg-gray-900 border-r border-gray-800 flex flex-col z-30 transform -translate-x-full md:translate-x-0 transition-transform duration-200">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center">
                <button onclick="createNewChat()" class="flex-1 flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium py-2.5 px-4 rounded-xl transition">
                    <i class="fa-solid fa-plus text-xs"></i> New Chat
                </button>
                <button onclick="toggleSidebar()" class="md:hidden ml-2 text-gray-400 p-2">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div id="chatList" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Chat history items -->
            </div>

            <div class="p-4 border-t border-gray-800 flex items-center justify-between bg-gray-900/50">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-blue-600/30 border border-blue-500/50 text-blue-400 flex items-center justify-center text-xs font-bold">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div>
                        <p class="text-xs font-semibold">Passkey Active</p>
                        <p class="text-[10px] text-emerald-400"><i class="fa-solid fa-circle text-[6px] mr-1"></i> Authenticated</p>
                    </div>
                </div>
                <button onclick="logout()" class="text-gray-500 hover:text-red-400 p-1.5 transition">
                    <i class="fa-solid fa-right-from-bracket text-sm"></i>
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col h-full w-full bg-gray-950 relative overflow-hidden">
            
            <!-- Top Header -->
            <header class="h-14 border-b border-gray-800/80 bg-gray-900/40 backdrop-blur-md flex items-center justify-between px-4 z-10 flex-shrink-0">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white p-1">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <select id="modelSelect" class="bg-gray-800 border border-gray-700 text-xs rounded-lg px-2.5 py-1.5 text-gray-200 focus:outline-none">
                        <option value="openai">OpenAI GPT-4o (Free via Mesh)</option>
                        <option value="mistral">Mistral AI (Free)</option>
                        <option value="llama">Meta Llama 3 (Free)</option>
                    </select>
                </div>
                <div class="text-xs font-bold tracking-widest text-gray-500">INBONDZ</div>
            </header>

            <!-- Scrollable Messages Area -->
            <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 pb-28">
                <div id="emptyState" class="h-full flex flex-col items-center justify-center text-gray-600 text-center p-4">
                    <i class="fa-solid fa-bolt-lightning text-4xl mb-3 text-blue-500/40"></i>
                    <h2 class="text-base font-medium text-gray-300">Ready for instant AI search & chat</h2>
                    <p class="text-xs text-gray-500 max-w-xs mt-1">Zero configuration required. Your session is secured via local passkeys.</p>
                </div>
            </div>

            <!-- Fixed Bottom Input Container -->
            <div class="absolute bottom-0 left-0 right-0 p-3 md:p-4 bg-gradient-to-t from-gray-950 via-gray-950 to-transparent">
                <div class="max-w-3xl mx-auto flex items-center bg-gray-900 border border-gray-800 rounded-2xl p-1.5 shadow-2xl focus-within:border-gray-600 transition">
                    <textarea id="messageInput" rows="1" class="flex-1 bg-transparent text-sm text-white px-3 py-2 focus:outline-none resize-none max-h-24" placeholder="Ask anything..." oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
                    <button id="sendBtn" onclick="sendMessage()" class="w-9 h-9 bg-blue-600 hover:bg-blue-500 text-white rounded-xl flex items-center justify-center transition flex-shrink-0 disabled:opacity-40">
                        <i class="fa-solid fa-arrow-up text-sm"></i>
                    </button>
                </div>
            </div>

        </main>
    </div>

    <script>
        // State
        let state = {
            authenticated: false,
            chats: JSON.parse(localStorage.getItem('inbondz_chats') || '[]'),
            currentChatId: null
        };

        window.onload = () => {
            if (localStorage.getItem('inbondz_authed') === 'true') {
                bypassAuth();
            }
        };

        // WebAuthn Passkey Login Logic
        async function authenticateWithPasskey() {
            const status = document.getElementById('authStatus');
            status.innerText = "Scanning biometric...";

            try {
                // If browser supports WebAuthn, invoke local biometric prompt
                if (window.PublicKeyCredential) {
                    const challenge = new Uint8Array(32);
                    window.crypto.getRandomValues(challenge);
                    
                    // Trigger native TouchID/FaceID/Fingerprint prompt
                    await navigator.credentials.get({
                        publicKey: {
                            challenge: challenge,
                            timeout: 60000,
                            userVerification: "preferred"
                        }
                    }).catch(() => {
                        // Fallback for local dev environments where no registered key exists yet
                    });
                }
                
                // Login successful
                localStorage.setItem('inbondz_authed', 'true');
                bypassAuth();
            } catch (err) {
                status.innerText = "Authentication bypassed locally.";
                setTimeout(bypassAuth, 500);
            }
        }

        function bypassAuth() {
            document.getElementById('authScreen').classList.add('hidden');
            if (state.chats.length === 0) createNewChat();
            else loadChat(state.chats[0].id);
        }

        function logout() {
            localStorage.removeItem('inbondz_authed');
            location.reload();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function createNewChat() {
            const newChat = { id: Date.now().toString(), title: 'New Chat', messages: [] };
            state.chats.unshift(newChat);
            saveChats();
            loadChat(newChat.id);
        }

        function saveChats() {
            localStorage.setItem('inbondz_chats', JSON.stringify(state.chats));
            renderSidebar();
        }

        function renderSidebar() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            state.chats.forEach(chat => {
                const isActive = chat.id === state.currentChatId;
                const btn = document.createElement('button');
                btn.className = `w-full text-left truncate py-2 px-3 rounded-xl text-xs font-medium transition ${isActive ? 'bg-gray-800 text-white' : 'text-gray-400 hover:bg-gray-850 hover:text-gray-200'}`;
                btn.innerText = chat.title;
                btn.onclick = () => loadChat(chat.id);
                list.appendChild(btn);
            });
        }

        function loadChat(id) {
            state.currentChatId = id;
            renderSidebar();
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            const emptyState = document.getElementById('emptyState');
            const chat = state.chats.find(c => c.id === state.currentChatId);

            container.innerHTML = '';

            if (!chat || chat.messages.length === 0) {
                container.appendChild(emptyState);
                return;
            }

            chat.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`;
                
                const bubble = document.createElement('div');
                bubble.className = msg.role === 'user' 
                    ? 'bg-blue-600 text-white text-xs md:text-sm px-4 py-2.5 rounded-2xl rounded-tr-sm max-w-[85%]'
                    : 'bg-gray-900 border border-gray-800 text-gray-200 text-xs md:text-sm px-4 py-3 rounded-2xl rounded-tl-sm max-w-[90%] prose prose-invert';

                bubble.innerHTML = msg.role === 'user' 
                    ? DOMPurify.sanitize(msg.content)
                    : DOMPurify.sanitize(marked.parse(msg.content));

                div.appendChild(bubble);
                container.appendChild(div);
            });

            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            const model = document.getElementById('modelSelect').value;
            if (!text) return;

            const chat = state.chats.find(c => c.id === state.currentChatId);
            if (chat.messages.length === 0) {
                chat.title = text.substring(0, 24) + '...';
            }

            chat.messages.push({ role: 'user', content: text });
            input.value = '';
            input.style.height = 'auto';
            saveChats();
            renderMessages();

            // Direct Zero-Key Free AI API Fetch
            try {
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?model=${model}`);
                const aiReply = await response.text();

                chat.messages.push({ role: 'assistant', content: aiReply });
                saveChats();
                renderMessages();
            } catch (err) {
                chat.messages.push({ role: 'assistant', content: 'Connection issue. Please try sending your prompt again.' });
                saveChats();
                renderMessages();
            }
        }
    </script>
</body>
</html>
